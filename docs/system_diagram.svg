<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <style>text{font-family:Arial,Helvetica,sans-serif;font-size:13px}</style>
  <!-- Browser -->
  <rect x="30" y="40" width="200" height="80" rx="8" fill="#f0f4ff" stroke="#2b6cb0"/>
  <text x="40" y="65" fill="#2b6cb0" font-weight="700">Browser</text>
  <text x="40" y="85" fill="#234">HTMX + SSE / Audio</text>

  <!-- Frontend -->
  <rect x="270" y="30" width="260" height="100" rx="8" fill="#f7fff5" stroke="#2f855a"/>
  <text x="290" y="55" fill="#2f855a" font-weight="700">Frontend</text>
  <text x="290" y="75" fill="#234">HTMX forms / React UI</text>
  <text x="290" y="95" fill="#234">Uploads → /upload, SSE → /events</text>

  <!-- Backend -->
  <rect x="560" y="30" width="240" height="140" rx="8" fill="#fff7ed" stroke="#dd6b20"/>
  <text x="580" y="55" fill="#dd6b20" font-weight="700">Backend (Go)</text>
  <text x="580" y="75" fill="#234">Orchestrator: /upload, /track-started, /events</text>
  <text x="580" y="95" fill="#234">Calls: Python analizator, Ollama, TTS</text>

  <!-- Librarian (Python) -->
  <rect x="560" y="190" width="240" height="120" rx="8" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="580" y="215" fill="#0369a1" font-weight="700">Librarian (Python)</text>
  <text x="580" y="235" fill="#234">Audio analysis (librosa / tinytag)</text>
  <text x="580" y="255" fill="#234">Imports metadata into SQLite</text>

  <!-- SQLite DB -->
  <rect x="830" y="60" width="120" height="70" rx="8" fill="#fff1f2" stroke="#b91c1c"/>
  <text x="846" y="90" fill="#991b1b" font-weight="700">SQLite</text>
  <text x="846" y="108" fill="#234">songs, play_history</text>

  <!-- AI & TTS -->
  <rect x="270" y="190" width="240" height="120" rx="8" fill="#fff7ff" stroke="#7c3aed"/>
  <text x="290" y="215" fill="#6d28d9" font-weight="700">AI / TTS</text>
  <text x="290" y="235" fill="#234">Ollama (Qwen, Llama) → Director / DJ</text>
  <text x="290" y="255" fill="#234">Chatterbox TTS → .wav</text>

  <!-- Liquidsoap + Icecast -->
  <rect x="30" y="250" width="200" height="120" rx="8" fill="#f7fff6" stroke="#15803d"/>
  <text x="50" y="275" fill="#065f46" font-weight="700">Liquidsoap</text>
  <text x="50" y="295" fill="#234">playlist(/music/), on_track → /track-started</text>
  <text x="50" y="315" fill="#234">Crossfade, ducking DJ voice</text>

  <rect x="30" y="390" width="200" height="60" rx="8" fill="#eef2ff" stroke="#3730a3"/>
  <text x="50" y="420" fill="#3730a3" font-weight="700">Icecast</text>
  <text x="50" y="438" fill="#234">/mount → audio stream</text>

  <!-- Music folder -->
  <rect x="560" y="330" width="240" height="60" rx="8" fill="#f0fff4" stroke="#16a34a"/>
  <text x="580" y="355" fill="#166534" font-weight="700">/music (files)</text>

  <!-- Arrows -->
  <line x1="230" y1="80" x2="270" y2="80" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="530" y1="80" x2="560" y2="80" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="700" y1="170" x2="830" y2="95" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="520" y1="150" x2="520" y2="190" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="520" y1="250" x2="520" y2="330" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="310" x2="560" y2="220" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="200" y1="440" x2="560" y2="350" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#333" />
    </marker>
  </defs>
</svg>
